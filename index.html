<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六月動物園 V31-血條絕對修正版</title>
    <style>
        :root { --p: #0288d1; --bg: #f4fafd; --text: #37474f; --accent: #ff7043; --hp-bg: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; max-width: 100vw; overflow-x: hidden; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .header-banner { width: 100%; padding: 15px; background: #b3e5fc linear-gradient(135deg, #b3e5fc 0%, #e1f5fe 100%); border-radius: 20px; margin-bottom: 15px; text-align: center; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .perf-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 15px; background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--p); }
        .perf-table th { background: #e1f5fe; padding: 8px; border-bottom: 2px solid var(--p); }
        .perf-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #eee; }
        .summary-box { background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; border: 2px solid #e1f5fe; }
        .summary-box div span { font-size: 0.8rem; color: #888; display: block; }
        .dino-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .dino-card { position: relative; background: white; border-radius: 25px; padding: 15px; border: 3px solid var(--p); box-shadow: 0 6px 15px rgba(0,0,0,0.06); min-height: 400px; padding-top: 60px; margin-top: 30px; }
        .card-avatar { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 50px; width: 80px; height: 80px; background: white; border: 5px solid var(--p); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; }
        .stamp { position: absolute; top: 10px; left: -10px; transform: rotate(-15deg); padding: 4px 12px; border: 2px solid #ccc; color: #ccc; font-weight: bold; font-size: 0.7rem; border-radius: 5px; cursor: pointer; background: white; z-index: 11; }
        .stamp.active { border-color: #f44336; color: #f44336; }
        .editable-title { width: 100%; border: none; background: transparent; text-align: center; font-size: 1.4rem; font-weight: bold; color: var(--p); border-bottom: 1px dashed #ccc; margin-bottom: 10px; position: relative; z-index: 2; }
        .hp-container { width: 180px; height: 16px; background: var(--hp-bg); margin: 0 auto 10px; border-radius: 10px; border: 2px solid #999; overflow: hidden; position: relative; z-index: 2; }
        .hp-bar { height: 100%; background: linear-gradient(to right, #ffeb3b, #0288d1); width: 0%; transition: width 0.6s ease; }
        .hp-marker { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 14px; top: 0; left: 0; pointer-events: none; }
        .calc-area { background: rgba(225, 245, 254, 0.5); padding: 10px; border-radius: 12px; margin-bottom: 12px; font-size: 0.85rem; position: relative; z-index: 2; }
        .calc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .manual-input { width: 60px; border: none; border-bottom: 1px solid #ccc; background: transparent; text-align: right; padding: 2px; font-size: 0.85rem; }
        .input-row { display: grid; grid-template-columns: 1.2fr 0.6fr 1.8fr; gap: 5px; margin-bottom: 10px; position: relative; z-index: 2; }
        .input-row input { padding: 8px 4px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem; width: 100%; }
        button { width: 100%; padding: 12px; border-radius: 15px; border: none; background: var(--p); color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; position: relative; z-index: 2; }
        .log-list { margin-top: 10px; height: 130px; overflow-y: auto; font-size: 0.8rem; border-top: 1px solid #eee; position: relative; z-index: 2; }
        .log-list table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .log-list td { padding: 8px 2px; border-bottom: 1px solid #f2f2f2; text-align: center; }
        .del-btn { color: #f44336; cursor: pointer; font-weight: bold; font-size: 0.75rem; text-decoration: underline; }
    </style>
</head>
<body>

<div class="header-banner">
    <h1>六月動物園養殖</h1>
    <p id="status-msg" style="font-size:0.8rem; color:#666;">⌛ 正在與雲端同步...</p>
</div>

<table class="perf-table">
    <thead><tr><th>收成/動物</th><th>總食量</th><th>飽食度</th><th>達成</th></tr></thead>
    <tbody id="performanceBody"></tbody>
</table>

<div class="summary-box">
    <div><span>🥩 總食量</span><b id="gRev" style="color: var(--accent);">$0</b></div>
    <div><span>💸 總支出</span><b id="gExp" style="color: #78909c;">$0</b></div>
    <div><span>💖 總飽食度</span><b id="gProfit" style="color: var(--p);">$0</b></div>
</div>

<div id="dinoContainer" class="dino-grid"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzXtfxf3wd7TSzwPR0KAxJwGp7mVKzV8PGojpnhpWexo4ldchhsSixue-jEXgIz6cF0/exec"; 

let selectedDate = localStorage.getItem('lastZooDate') || new Date().toISOString().split('T')[0];

// 原本 8 隻卡片和圖標完全不變，最下方固定多一隻 🦩
const defaultDinos = [
    { id: 0, icon: "Rex", name: "新竹巨城", taxRate: 33, rent: 9000, extraTax: 0, harvested: false },
    { id: 1, icon: "Whale", name: "桃園新光", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 2, icon: "Owl", name: "板橋環球", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 3, icon: "Fish", name: "內湖三總", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 4, icon: "Dino", name: "日月光B1", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 5, icon: "Cow", name: "北榮", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 6, icon: "Lobster", name: "林口A9", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 7, icon: "Rooster", name: "松山機場", taxRate: 33, rent: 0, extraTax: 0, harvested: false },
    { id: 8, icon: "Flamingo", name: "追加加場點", taxRate: 33, rent: 0, extraTax: 0, harvested: false }
];

let counters = JSON.parse(JSON.stringify(defaultDinos)).map(d => ({ ...d, logs: [] }));

function getDinoEmoji(iconName) {
    const emojis = { 
        "Rex": "🦖", "Whale": "🐳", "Owl": "🦉", "Fish": "🐠", 
        "Dino": "🦕", "Cow": "🐄", "Lobster": "🦞", "Rooster": "🐓",
        "Flamingo": "🦩"
    };
    return emojis[iconName] || "❓";
}

async function cloudSaveSettings() {
    const settings = counters.map(c => ({
        id: c.id, et: c.extraTax, rt: c.rent, tr: c.taxRate, hv: c.harvested, nm: c.name
    }));
    try {
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "saveSettings", settings: settings }) });
        document.getElementById('status-msg').innerText = "✅ 所有設備同步完成";
    } catch (e) { document.getElementById('status-msg').innerText = "❌ 設定同步失敗"; }
}

async function fetchCloudData() {
    try {
        const response = await fetch(GAS_URL + "?action=read");
        const resData = await response.json();
        counters.forEach(c => c.logs = []);
        resData.logs.forEach(row => {
            const dino = counters.find(d => d.name.trim() === String(row.name).trim());
            if (dino) dino.logs.push({ date: row.date, qty: row.qty, amt: row.amt });
        });
        if (resData.settings) {
            resData.settings.forEach(s => {
                const d = counters.find(c => c.id === s.id);
                if (d) { d.extraTax = s.et; d.rent = s.rt; d.taxRate = s.tr; d.harvested = s.hv; d.name = s.nm; }
            });
        }
        document.getElementById('status-msg').innerText = "✅ 數據更新成功";
        render();
    } catch (e) {
        document.getElementById('status-msg').innerText = "⚠️ 目前為離線模式";
        render();
    }
}

function handleDateChange(newVal) {
    selectedDate = newVal;
    localStorage.setItem('lastZooDate', newVal);
    render(); 
}

function render() {
    const container = document.getElementById('dinoContainer');
    const perfBody = document.getElementById('performanceBody');
    container.innerHTML = ''; perfBody.innerHTML = '';
    let gRev = 0, gExp = 0, perfData = [];

    counters.forEach(c => {
        const rev = c.logs.reduce((s, l) => s + (Number(l.amt) || 0), 0);
        const qty = c.logs.reduce((s, l) => s + (Number(l.qty) || 0), 0);
        const cost = qty * 55.2;
        const tax = rev * (c.taxRate / 100);
        const profit = rev - tax - cost - (c.rent || 0) - (c.extraTax || 0);
        gRev += rev; gExp += (tax + cost + (c.rent || 0) + (c.extraTax || 0));
        
        // 絕對修正：滿血精準計算為 50,000 元，並避免被任何外部設定覆蓋
        const maxHpTarget = 50000;
        const hpPercent = Math.min(Math.max((profit / maxHpTarget) * 100, 0), 100);

        perfData.push({ icon: getDinoEmoji(c.icon), name: c.name, rev, profit, hpPercent, harvested: c.harvested });

        const card = document.createElement('div');
        card.className = 'dino-card';
        card.innerHTML = `
            <div class="card-avatar">${getDinoEmoji(c.icon)}</div>
            <div class="stamp ${c.harvested ? 'active' : ''}" onclick="toggleHarvest(${c.id})">8/15 收成</div>
            <input class="editable-title" type="text" value="${c.name}" onchange="update(${c.id}, 'name', this.value)">
            <div class="hp-container"><div class="hp-bar" style="width: ${hpPercent}%;"></div><div class="hp-marker">${hpPercent >= 100 ? '👑 MAX' : '⭐'}</div></div>
            <div class="calc-area">
                <div class="calc-row"><span>🥩 累積食量:</span><b>$${rev.toLocaleString()}</b></div>
                <div class="calc-row"><span>📦 成本:</span><b>$${cost.toFixed(0)}</b></div>
                <div class="calc-row"><span>👑 國王稅 (<input type="number" class="manual-input" style="width:35px" value="${c.taxRate}" onchange="update(${c.id}, 'taxRate', this.value)">%):</span><span>$${tax.toFixed(0)}</span></div>
                <div class="calc-row" style="color: #d32f2f;"><span>💸 補繳稅:</span><input type="number" class="manual-input" value="${c.extraTax}" onchange="update(${c.id}, 'extraTax', this.value)"></div>
                <div class="calc-row" style="color: #5d4037;"><span>🏠 小窩錢:</span><input type="number" class="manual-input" value="${c.rent}" onchange="update(${c.id}, 'rent', this.value)"></div>
                <div class="calc-row" style="color:var(--p); font-weight:bold; border-top:1px dashed #ccc; padding-top:8px; margin-top:5px;"><span>💖 飽食度:</span><span>$${profit.toLocaleString(undefined, {maximumFractionDigits:0})}</span></div>
            </div>
            <div class="input-row">
               <input type="date" id="date-${c.id}" value="${selectedDate}" onchange="handleDateChange(this.value)">
                <input type="number" id="qty-${c.id}" placeholder="只">
                <input type="number" id="amt-${c.id}" placeholder="金額" onkeypress="if(event.key==='Enter')addAndSync(${c.id})">
            </div>
            <button onclick="addAndSync(${c.id})">🍖 餵食同步</button>
            <div class="log-list"><table>${c.logs.map((l, idx) => `<tr><td width="25%">${l.date}</td><td width="25%">${l.qty}只</td><td width="30%">$${Number(l.amt).toLocaleString()}</td><td width="20%"><span class="del-btn" onclick="deleteLog(${c.id}, ${idx})">刪除</span></td></tr>`).reverse().join('')}</table></div>
        `;
        container.appendChild(card);
    });

    perfData.sort((a,b) => b.profit - a.profit).forEach(p => {
        perfBody.innerHTML += `<tr><td>${p.harvested ? '<span style="color:#f44336; font-weight:bold;">[收]</span> ' : ''}${p.icon} ${p.name}</td><td>$${p.rev.toLocaleString()}</td><td style="color:var(--p); font-weight:bold;">$${p.profit.toLocaleString(undefined, {maximumFractionDigits:0})}</td><td>${p.hpPercent.toFixed(0)}%</td></tr>`;
    });

    document.getElementById('gRev').innerText = '$' + gRev.toLocaleString();
    document.getElementById('gExp').innerText = '$' + gExp.toLocaleString(undefined, {maximumFractionDigits:0});
    document.getElementById('gProfit').innerText = '$' + (gRev - gExp).toLocaleString(undefined, {maximumFractionDigits:0});
}

window.update = (id, f, v) => { counters[id][f] = (f==='name'?v:parseFloat(v)||0); render(); cloudSaveSettings(); };
window.toggleHarvest = (id) => { counters[id].harvested = !counters[id].harvested; render(); cloudSaveSettings(); };

async function deleteLog(dinoId, logIndex) {
    const log = counters[dinoId].logs[logIndex];
    const name = counters[dinoId].name;
    counters[dinoId].logs.splice(logIndex, 1);
    render();
    try { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", name: name, amt: log.amt }) }); } catch (e) {}
}

async function addAndSync(id) {
    const q = document.getElementById(`qty-${id}`), a = document.getElementById(`amt-${id}`), d = document.getElementById(`date-${id}`);
    if (a.value === "") return alert("請輸入金額");
    const log = { date: d.value.slice(5), amt: Number(a.value), qty: Number(q.value) };
    counters[id].logs.push(log);
    render(); 
    const sData = { action: "add", ...log, name: counters[id].name, fullDate: d.value };
    q.value = ''; a.value = '';
    try { await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(sData) }); fetchCloudData(); } catch (e) {}
}

fetchCloudData();
</script>
</body>
</html>
